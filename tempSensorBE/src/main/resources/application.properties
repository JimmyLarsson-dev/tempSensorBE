spring.application.name=tempSensorBE
# Secrets come from environment variables. For local dev, put them in a .env file
# in the project root (git-ignored); real environment variables take precedence.
spring.config.import=optional:file:.env[.properties]
#spring.mongodb.uri=mongodb://localhost:27017/myDeployment
#spring.mongodb.database=tempsensor

spring.datasource.url=jdbc:postgresql://localhost:5432/temperatures
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.debug=true
logging.level.org.springframework.mail=DEBUG
logging.level.org.apache.commons.mail=DEBUG
logging.level.com.sun.mail=DEBUG

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

spring.mail.protocol=smtp

# Elementets API på det interna nätverket. Gissad adress - ändra när vi vet den riktiga.
# Kan skrivas över med miljövariabeln HEATER_BASE_URL.
heater.base-url=${HEATER_BASE_URL:http://192.168.1.50}
spring.mail.properties.mail.smtp.from=${MAIL_USERNAME}